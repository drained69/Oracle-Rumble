# Nixpacks build plan for Oracle Rumble (Next.js 15 / React 19).
# Railway auto-detects Next.js, but this pins Node 20 and keeps the
# install/build/start phases explicit so the deploy is reproducible.

[phases.setup]
nixPkgs = ["nodejs_20", "npm-9_x"]

[phases.install]
# Use `install` instead of `ci` to avoid the Nixpacks EBUSY issue where
# `npm ci` tries to wipe node_modules/.cache while Nixpacks holds its own
# cache mount pointed at /app/.next/cache. `install --prefer-offline` reuses
# the lockfile without deleting node_modules first.
cmds = ["npm install --prefer-offline --no-audit --no-fund"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"
