[package]
name = "oracle-rumble-escrow"
version = "0.1.0"
edition = "2021"
description = "Non-custodial escrow for Oracle Rumble — pooled entry + per-player trading vaults on Solana"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
solana-program = "2.1"
spl-token = { version = "6.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "6.0", features = ["no-entrypoint"] }
borsh = "1.5"
thiserror = "1.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
